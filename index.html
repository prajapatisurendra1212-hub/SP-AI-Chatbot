<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SP AI Chatbot</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f2f5f9;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .chatbot {
      width: 100%;
      max-width: 500px;
      height: 95vh;
      background: white;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
      display: flex;
      flex-direction: column;
    }

    .header {
      background: #111827;
      color: white;
      padding: 18px;
      text-align: center;
    }

    .header h1 {
      font-size: 25px;
    }

    .header p {
      font-size: 13px;
      margin-top: 5px;
      opacity: 0.8;
    }

    .settings {
      padding: 12px;
      background: #f8fafc;
      border-bottom: 1px solid #ddd;
    }

    .settings input {
      width: 100%;
      padding: 11px;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
      margin-bottom: 8px;
    }

    .settings button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }

    .settings button:hover {
      background: #1d4ed8;
    }

    .chat-box {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      background: #ffffff;
    }

    .message {
      max-width: 80%;
      padding: 11px 14px;
      margin-bottom: 12px;
      border-radius: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .user {
      background: #2563eb;
      color: white;
      margin-left: auto;
      border-bottom-right-radius: 4px;
    }

    .bot {
      background: #e5e7eb;
      color: #111827;
      margin-right: auto;
      border-bottom-left-radius: 4px;
    }

    .input-area {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid #ddd;
      background: white;
    }

    .input-area input {
      flex: 1;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 10px;
      outline: none;
      font-size: 15px;
    }

    .input-area button {
      padding: 0 18px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    .input-area button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    .clear-btn {
      margin-top: 8px;
      background: #dc2626 !important;
    }

    .clear-btn:hover {
      background: #b91c1c !important;
    }
  </style>
</head>

<body>

  <div class="chatbot">

    <!-- Header -->
    <div class="header">
      <h1>SP AI Chatbot</h1>
      <p>Powered by Groq API</p>
    </div>

    <!-- API Settings -->
    <div class="settings">

      <input
        type="password"
        id="apiKey"
        placeholder="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"
        autocomplete="off"
      >

      <button onclick="saveAPIKey()">
        Save API Key
      </button>

      <button class="clear-btn" onclick="clearAPIKey()">
        Clear Saved API Key
      </button>

    </div>

    <!-- Chat -->
    <div class="chat-box" id="chatBox">

      <div class="message bot">
        Hello! 👋 I am SP AI Chatbot.

        Please enter your Groq API key above and then ask me anything.
      </div>

    </div>

    <!-- Message Input -->
    <div class="input-area">

      <input
        type="text"
        id="userInput"
        placeholder="Type your message..."
        onkeydown="handleEnter(event)"
      >

      <button id="sendBtn" onclick="sendMessage()">
        Send
      </button>

    </div>

  </div>


  <script>

    // --------------------------------
    // GROQ API CONFIGURATION
    // --------------------------------

    const GROQ_URL =
      "https://api.groq.com/openai/v1/chat/completions";

    const MODEL =
      "llama-3.3-70b-versatile";


    // Get saved API key
    let apiKey =
      localStorage.getItem("groq_api_key") || "";


    // --------------------------------
    // SAVE API KEY
    // --------------------------------

    function saveAPIKey() {

      const key =
        document.getElementById("apiKey").value.trim();

      if (!key) {

        alert("Please enter your Groq API key.");

        return;
      }

      apiKey = key;

      localStorage.setItem(
        "groq_api_key",
        key
      );

      alert("Groq API key saved successfully!");

    }


    // --------------------------------
    // CLEAR API KEY
    // --------------------------------

    function clearAPIKey() {

      localStorage.removeItem("groq_api_key");

      apiKey = "";

      document.getElementById("apiKey").value = "";

      alert("Saved API key cleared.");

    }


    // --------------------------------
    // ADD MESSAGE
    // --------------------------------

    function addMessage(text, type) {

      const chatBox =
        document.getElementById("chatBox");

      const message =
        document.createElement("div");

      message.className =
        "message " + type;

      message.textContent = text;

      chatBox.appendChild(message);

      chatBox.scrollTop =
        chatBox.scrollHeight;

    }


    // --------------------------------
    // SEND MESSAGE
    // --------------------------------

    async function sendMessage() {

      const input =
        document.getElementById("userInput");

      const sendBtn =
        document.getElementById("sendBtn");

      const message =
        input.value.trim();


      // Empty message
      if (!message) {
        return;
      }


      // API key check
      if (!apiKey) {

        alert(
          "Please enter and save your Groq API key first."
        );

        return;
      }


      // Show user message
      addMessage(
        message,
        "user"
      );

      input.value = "";


      // Disable button
      sendBtn.disabled = true;

      sendBtn.textContent =
        "Thinking...";


      try {

        // --------------------------------
        // GROQ API REQUEST
        // --------------------------------

        const response =
          await fetch(
            GROQ_URL,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json",

                "Authorization":
                  "Bearer " + apiKey
              },

              body: JSON.stringify({

                model: MODEL,

                messages: [

                  {
                    role: "system",

                    content:
                      "You are SP AI Chatbot, a helpful, friendly and accurate AI assistant. Give clear answers and respond in the same language as the user whenever possible."
                  },

                  {
                    role: "user",

                    content: message
                  }

                ],

                temperature: 0.7,

                max_tokens: 1024

              })

            }
          );


        // Convert response to JSON
        const data =
          await response.json();


        // --------------------------------
        // ERROR HANDLING
        // --------------------------------

        if (!response.ok) {

          throw new Error(
            data?.error?.message ||
            "Groq API request failed."
          );

        }


        // --------------------------------
        // GET AI RESPONSE
        // --------------------------------

        const reply =
          data?.choices?.[0]?.message?.content;


        if (!reply) {

          throw new Error(
            "No response received from Groq."
          );

        }


        // Show AI response
        addMessage(
          reply,
          "bot"
        );


      } catch (error) {

        console.error(
          "Groq API Error:",
          error
        );


        addMessage(
          "Error: " + error.message,
          "bot"
        );

      } finally {

        // Enable button
        sendBtn.disabled = false;

        sendBtn.textContent =
          "Send";

      }

    }


    // --------------------------------
    // ENTER KEY
    // --------------------------------

    function handleEnter(event) {

      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {

        event.preventDefault();

        sendMessage();

      }

    }


    // --------------------------------
    // LOAD SAVED API KEY
    // --------------------------------

    document.getElementById(
      "apiKey"
    ).value = apiKey;


  </script>

</body>
</html>
