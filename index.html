<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SP AI Chatbot</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f2f5f9;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .chatbot {
      width: 100%;
      max-width: 500px;
      height: 95vh;
      background: white;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
    }

    .header {
      background: #111827;
      color: white;
      padding: 18px;
      text-align: center;
    }

    .header h1 {
      font-size: 25px;
    }

    .header p {
      font-size: 13px;
      margin-top: 5px;
      opacity: 0.8;
    }

    .settings {
      padding: 12px;
      background: #f8fafc;
      border-bottom: 1px solid #ddd;
    }

    .settings input {
      width: 100%;
      padding: 11px;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
      margin-bottom: 8px;
    }

    .settings button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }

    .chat-box {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      background: #ffffff;
    }

    .message {
      max-width: 80%;
      padding: 11px 14px;
      margin-bottom: 12px;
      border-radius: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .user {
      background: #2563eb;
      color: white;
      margin-left: auto;
      border-bottom-right-radius: 4px;
    }

    .bot {
      background: #e5e7eb;
      color: #111827;
      margin-right: auto;
      border-bottom-left-radius: 4px;
    }

    .input-area {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid #ddd;
      background: white;
    }

    .input-area input {
      flex: 1;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 10px;
      outline: none;
      font-size: 15px;
    }

    .input-area button {
      padding: 0 18px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    .input-area button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }
  </style>
</head>

<body>

  <div class="chatbot">

    <div class="header">
      <h1>SP AI Chatbot</h1>
      <p>Powered by Groq API</p>
    </div>

    <div class="settings">
      <input
        type="password"
        id="apiKey"
        placeholder="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"
      >

      <button onclick="saveAPIKey()">
        Save API Key
      </button>
    </div>

    <div class="chat-box" id="chatBox">
      <div class="message bot">
        Hello! 👋 I am SP AI Chatbot. Enter your Groq API key and ask me anything.
      </div>
    </div>

    <div class="input-area">
      <input
        type="text"
        id="userInput"
        placeholder="Type your message..."
        onkeydown="handleEnter(event)"
      >

      <button id="sendBtn" onclick="sendMessage()">
        Send
      </button>
    </div>

  </div>


  <script>

    // Groq API
    const GROQ_URL = "https://api.groq.com/openai/v1/chat/completions";

    // Model
    const MODEL = "llama-3.3-70b-versatile";

    let apiKey = localStorage.getItem("groq_api_key") || "";

    // Save API Key
    function saveAPIKey() {

      const key = document.getElementById("apiKey").value.trim();

      if ("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");
        return;
      }

      apiKey = key;

      localStorage.setItem("groq_api_key", key);

      alert("API Key saved successfully!");
    }


    // Add message to chat
    function addMessage(text, type) {

      const chatBox = document.getElementById("chatBox");

      const message = document.createElement("div");

      message.className = "message " + type;

      message.textContent = text;

      chatBox.appendChild(message);

      chatBox.scrollTop = chatBox.scrollHeight;
    }


    // Send message
    async function sendMessage() {

      const input = document.getElementById("userInput");
      const sendBtn = document.getElementById("sendBtn");

      const message = input.value.trim();

      if (!message) return;

      if (!apiKey) {
        alert("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");
        return;
      }

      addMessage(message, "user");

      input.value = "";

      sendBtn.disabled = true;
      sendBtn.textContent = "Thinking...";

      try {

        const response = await fetch(GROQ_URL, {

          method: "POST",

          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + apiKey
          },

          body: JSON.stringify({

            model: MODEL,

            messages: [
              {
                role: "system",
                content:
                  "You are SP AI Chatbot, a helpful and friendly AI assistant. Answer clearly and accurately."
              },

              {
                role: "user",
                content: message
              }
            ],

            temperature: 0.7,

            max_tokens: 1024

          })

        });


        const data = await response.json();


        if (!response.ok) {

          throw new Error(
            data.error?.message ||
            "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"
          );

        }


        const reply =
          data.choices?.[0]?.message?.content ||
          "Sorry, I could not generate a response.";


        addMessage(reply, "bot");


      } catch (error) {

        addMessage(
          "Error: " + error.message,
          "bot"
        );

      } finally {

        sendBtn.disabled = false;
        sendBtn.textContent = "Send";

      }
    }


    // Enter key
    function handleEnter(event) {

      if (event.key === "Enter") {
        sendMessage();
      }

    }


    // Load saved API key
    document.getElementById("apiKey").value = apiKey;

  </script>

</body>
</html>
